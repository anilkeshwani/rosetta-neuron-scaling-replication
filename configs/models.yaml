# Model registry. One entry per checkpoint we may match.
#
# n_layers and d_mlp are checked against each model's Hub config by
# scripts/verify_model_registry.py; n_neurons is derived (n_layers * d_mlp), never stored.
#
# mlp_type:
#   gelu   - phi(W_in h), neuron = post-GELU coordinate (Pythia, GPT-2)
#   relu   - post-ReLU coordinate (OPT)
#   gated  - act(gate) * up, the input to down_proj (Qwen2.5, Llama, Gemma)
#
# distilled_from: null if pretrained from scratch, else a short note on the teacher.
# Distilled checkpoints are not independent of their teacher, which matters for any
# within-family comparison (see docs/REPLICATION_PLAN.md, Phase 3).
#
# gated_repo: true if the Hub repo requires accepting a license before download.

families:
  pythia:
    note: GPT-NeoX, all sizes trained on the Pile in the same order (deterministic data loader).
  opt:
    note: Meta OPT; trained on a mixture incl. a Pile subset.
  gpt2:
    note: OpenAI GPT-2, WebText.
  qwen2.5:
    note: Base (non-Instruct) Qwen2.5.
  gemma3:
    note: Base "-pt" checkpoints. 4B and up are multimodal (Gemma3ForConditionalGeneration); we use the text decoder.
  gemma2:
    note: Base checkpoints.
  llama3:
    note: Base (non-Instruct) Llama 3.1 / 3.2.

