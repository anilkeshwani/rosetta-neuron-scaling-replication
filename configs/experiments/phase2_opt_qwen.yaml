name: phase2_opt_qwen
description: >
  OPT-Qwen2.5 curve (Fig. 3a, 12.43 x^0.57). First gated-MLP family: the neuron is
  act(gate)*up, captured as the input to down_proj. The 30B/32B point does not fit on
  the local GPUs (two bf16 models ~124 GB) and is marked for cloud.
reference_fit: language.opt_qwen2.5
defaults:
  NUM_SAMPLES: 10000000
  K_NEIGHBORS_LIST: "1 2 5 10"
  STOP_AFTER_ROSETTA: "true"
pairs:
  - models: [facebook/opt-1.3b, Qwen/Qwen2.5-1.5B]
  - models: [facebook/opt-2.7b, Qwen/Qwen2.5-3B]
    env: {BATCH_SIZE: 4, B_BLOCK: 1}
  - models: [facebook/opt-6.7b, Qwen/Qwen2.5-7B]
    env: {USE_FSDP: "true", BATCH_SIZE: 2, B_BLOCK: 1}
  - models: [facebook/opt-13b, Qwen/Qwen2.5-14B]
    env: {USE_FSDP: "true", BATCH_SIZE: 1, B_BLOCK: 1}
  - models: [facebook/opt-30b, Qwen/Qwen2.5-32B]
    requires: cloud
