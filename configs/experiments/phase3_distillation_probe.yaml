name: phase3_distillation_probe
description: >
  Does shared lineage inflate Rosetta counts? Hold the student fixed and match it against
  (a) its teacher and (b) an unrelated model of similar size to the teacher. If distillation
  transfers neurons, (a) >> (b). Not a scaling curve; compare counts pairwise.
reference_fit: null
defaults:
  NUM_SAMPLES: 10000000
  STOP_AFTER_ROSETTA: "true"
pairs:
  - models: [meta-llama/Llama-3.2-1B, meta-llama/Llama-3.1-8B]
    env: {USE_FSDP: "true", BATCH_SIZE: 2, B_BLOCK: 1}
    tag: student_vs_teacher
  - models: [meta-llama/Llama-3.2-1B, Qwen/Qwen2.5-7B]
    env: {USE_FSDP: "true", BATCH_SIZE: 2, B_BLOCK: 1}
    tag: student_vs_unrelated
  - models: [meta-llama/Llama-3.2-3B, meta-llama/Llama-3.1-8B]
    env: {USE_FSDP: "true", BATCH_SIZE: 2, B_BLOCK: 1}
    tag: student_vs_teacher
  - models: [meta-llama/Llama-3.2-3B, Qwen/Qwen2.5-7B]
    env: {USE_FSDP: "true", BATCH_SIZE: 2, B_BLOCK: 1}
    tag: student_vs_unrelated
