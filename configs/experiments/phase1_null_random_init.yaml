name: phase1_null_random_init
description: >
  Random-initialization null (Fig. 4): the same pipeline on untrained networks built with
  each architecture's own init. Expect a handful of matches and no trend with size.
  Checkpoints are created by scripts/make_random_init_checkpoints.py under
  $ROSETTA_DATA/random_init/<model>-seed<k>; the directory names keep the family string
  because upstream picks hook points by substring of the model path.
reference_fit: null
# Token sample drawn as an 8-rank run would (the authors used 8 GPUs); see scripts/build_token_cache.py
token_cache_world_size: 8
defaults:
  NUM_SAMPLES: 10000000
  STOP_AFTER_ROSETTA: "true"
pairs:
  - models: [$ROSETTA_DATA/random_init/pythia-160m-seed0, $ROSETTA_DATA/random_init/opt-125m-seed0]
  - models: [$ROSETTA_DATA/random_init/pythia-160m-seed1, $ROSETTA_DATA/random_init/opt-125m-seed1]
  - models: [$ROSETTA_DATA/random_init/pythia-160m-seed2, $ROSETTA_DATA/random_init/opt-125m-seed2]
  - models: [$ROSETTA_DATA/random_init/pythia-410m-seed0, $ROSETTA_DATA/random_init/opt-350m-seed0]
  - models: [$ROSETTA_DATA/random_init/pythia-410m-seed1, $ROSETTA_DATA/random_init/opt-350m-seed1]
  - models: [$ROSETTA_DATA/random_init/pythia-410m-seed2, $ROSETTA_DATA/random_init/opt-350m-seed2]
  - models: [$ROSETTA_DATA/random_init/pythia-1.4b-seed0, $ROSETTA_DATA/random_init/opt-1.3b-seed0]
  - models: [$ROSETTA_DATA/random_init/pythia-1.4b-seed1, $ROSETTA_DATA/random_init/opt-1.3b-seed1]
  - models: [$ROSETTA_DATA/random_init/pythia-1.4b-seed2, $ROSETTA_DATA/random_init/opt-1.3b-seed2]
